{#
  Reusable delete-confirmation dialog, shared by every removable row (fish tank,
  chemical cabinet). A trash button carries data-delete-url and data-delete-name;
  nav.js fills this dialog from them and opens it. The form posts to the url.
#}
<dialog class="modal" id="confirm-delete-modal" aria-labelledby="confirm-delete-title">
  <form class="modal__panel" method="post" data-confirm-form>
    <h2 class="modal__title" id="confirm-delete-title">Remove item</h2>
    <p class="modal__text" data-confirm-text></p>
    <div class="modal__actions">
      <button class="btn" type="button" data-close-modal>Cancel</button>
      <button class="btn btn--danger" type="submit">Remove</button>
    </div>
  </form>
</dialog>
