---
id: https://w3id.org/sierra-moxon/zebrafish-toxicology-atlas-schema
name: zebrafish-toxicology-atlas-schema
title: zebrafish-toxicology-atlas-schema
description: |-
  Schema to represent metadatcha associated with the Zebrafish Toxicology Atlas
license: MIT
see_also:
  - https://sierra-moxon.github.io/zebrafish-toxicology-atlas-schema

prefixes:
  zebrafish_toxicology_atlas_schema: https://w3id.org/sierra-moxon/zebrafish-toxicology-atlas-schema/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: https://example.org/
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  CAS: https://commonchemistry.cas.org/detail?cas_rn=
  ECTO: http://purl.obolibrary.org/obo/ECTO_
  EXO: http://purl.obolibrary.org/obo/EXO_
  ZP: http://purl.obolibrary.org/obo/ZP_
  GENO: http://purl.obolibrary.org/obo/GENO_
  SO: http://purl.obolibrary.org/obo/SO_
  ORCID: https://orcid.org/
  ZFIN: https://zfin.org/
  UMLS: https://uts.nlm.nih.gov/uts/umls/concept/
  "PUBCHEM.COMPOUND": https://identifiers.org/pubchem.compound/
  UNII: https://fdasis.nlm.nih.gov/srs/unii/
default_prefix: zebrafish_toxicology_atlas_schema
default_range: string

imports:
  - linkml:types
  - chemical_enums

classes:

  # Base classes for different ID strategies
  ZappEntity:
    description: Internal entities with auto-generated integer IDs.
    abstract: true
    slots:
      - id

  OntologyEntity:
    description: Entities representing ontology terms with URI identifiers.
    abstract: true

  # Internal entities (integer autoincrement)
  Study:
    is_a: ZappEntity
    description: A toxicological investigation, including the experimental conditions and phenotypic outcomes, with information provenance.
    slots:
      - experiment
      - publication
      - annotator
      - lab

  Experiment:
    is_a: ZappEntity
    description: A group of observations (phenotypic outcomes and their control) that are linked by a common exposure event and subject, and that are part of a study.
    slots:
      - standard_rearing_condition
      - rearing_condition_comment
      - fish
      - control
      - exposure_event

  PhenotypeObservationSet:
    is_a: ZappEntity
    description: An observation set containing control and phenotypic outcome resulting from an exposure event.
    slots:
      - image
      - phenotype
      - control_image

  Phenotype:
    is_a: ZappEntity
    description: Any measurable or visible trait change in the subject as a result of exposure.
    slots:
      - stage
      - prevalence
      - severity
      - phenotype_term_id

  Control:
    is_a: ZappEntity
    description: A subject serves as a reference for assessing phenotypic outcome in the phenotype observation set. 
    slots:
      - control_type
      - vehicle_if_treated
      - comment
      - control_image

  ExposureEvent:
    is_a: ZappEntity
    description: >-
      An occurrence in a study where a subject is exposed to a stressor under defined conditions.
    slots:
      - stressor
      - vehicle
      - route
      - regimen
      - exposure_start_stage
      - exposure_end_stage
      - comment
      - exposure_type
      - additional_exposure_condition
      - phenotype_observation
    exact_mappings:
      - biolink:ExposureEvent

  Regimen:
    is_a: ZappEntity
    description: The schedule and pattern of an exposure event.
    slots:
      - exposure_regimen_type
      - interval_between_individual_exposures
      - total_exposure_duration
      - individual_exposure_duration
      - number_of_individual_exposure

  StressorChemical:
    is_a: ZappEntity
    description: A chemical that elicits a response (a phenotype) in a subject when encountered through exposure.
    slots:
      - chemical_id
      - cas_id
      - unrecognized_chemical_name
      - synonym
      - manufacturer
      - unrecognized_manufacturer_name
      - concentration
      - comment
    rules:
      - description: >-
          A chemical entry must be identifiable: at least one of chemical_id
          (a standardized identifier / CURIE) or unrecognized_chemical_name
          (the free-text fallback for a chemical that could not be resolved)
          must be present.
        postconditions:
          any_of:
            - slot_conditions:
                chemical_id:
                  required: true
            - slot_conditions:
                unrecognized_chemical_name:
                  required: true
      - description: >-
          Picking the other_not_listed manufacturer escape hatch means the
          supplier has to be named in free text; without it the entry records
          no recoverable supplier at all.
        preconditions:
          slot_conditions:
            manufacturer:
              equals_string: other_not_listed
        postconditions:
          slot_conditions:
            unrecognized_manufacturer_name:
              required: true

  VehicleOfTransmission:
    is_a: ZappEntity
    description: The substance or medium used to deliver a stressor to a subject during an exposure event.
    slots:
      - vehicle_type
      - chemical_id
      - cas_id
      - unrecognized_chemical_name
      - synonym
      - manufacturer
      - unrecognized_manufacturer_name
      - concentration
      - comment
    rules:
      - description: >-
          Picking the other_not_listed vehicle escape hatch means the vehicle
          has to be named in free text; without it the entry records no
          recoverable vehicle at all.
        preconditions:
          slot_conditions:
            vehicle_type:
              equals_string: other_not_listed
        postconditions:
          slot_conditions:
            unrecognized_chemical_name:
              required: true
      - description: >-
          Picking the other_not_listed manufacturer escape hatch means the
          supplier has to be named in free text; without it the entry records
          no recoverable supplier at all.
        preconditions:
          slot_conditions:
            manufacturer:
              equals_string: other_not_listed
        postconditions:
          slot_conditions:
            unrecognized_manufacturer_name:
              required: true

  Image:
    is_a: ZappEntity
    description: An image associated with a phenotype observation.
    slots:
      - magnification
      - resolution
      - scale_bar

  ControlImage:
    is_a: ZappEntity
    description: An image associated with a control, taken at the same developmental stage as the corresponding phenotype observation.
    slots:
      - phenotype_id
      - magnification
      - resolution
      - scale_bar
      - phenotype_comments

  # Ontology entities (string URI identifiers)
  PhenotypeTerm:
    is_a: OntologyEntity
    description: A phenotype ontology term from the Zebrafish Phenotype ontology (ZP).
    slots:
      - term_uri
      - term_label
    exact_mappings:
      - biolink:PhenotypicFeature

  ExposureRoute:
    is_a: OntologyEntity
    description: |
      A route-of-exposure term. Term URIs are expected to be reachable from
      EXO:0000154 (route of exposure) in the EXO ontology.
    slots:
      - term_uri
      - term_label
    slot_usage:
      term_label:
        required: true

  ExposureType:
    is_a: OntologyEntity
    description: |
      An exposure-type term from ECTO.
    slots:
      - term_uri
      - term_label
    slot_usage:
      term_label:
        required: true

  # Fish / genotype (mirrors ZFIN's Fish = intrinsic Genotype + extrinsic STRs)
  Fish:
    is_a: ZappEntity
    description: >-
      A zebrafish subject in a study. Mirrors ZFIN's Fish object (GENO:0000525,
      "effective genotype"): a Fish is the combination of an intrinsic Genotype
      (mutant alleles, transgenics and wild-type background) and any transient
      gene-targeting reagents (STRs — morpholinos/CRISPRs). The STR / gene-targeting
      reagent component is out of scope for ZAPP at this time and is intentionally
      not modeled yet. The Fish carries its own ZFIN fish identifier (ZDB-FISH-…),
      which is distinct from the ZDB-GENO-… identifier of its Genotype; either may
      be absent for lab-specific fish not yet registered with ZFIN.
    slots:
      - name
      - fish_zfin_id
      - genotype
      - cross
    slot_usage:
      name:
        required: true
    exact_mappings:
      - GENO:0000525

  Genotype:
    is_a: ZappEntity
    description: >-
      The intrinsic genotype of a fish (GENO:0000000) — equivalently, a *line*: the
      heritable combination of a wild-type genetic background plus any mutant
      allele(s) and transgenic insertion(s). Carries its own ZFIN genotype
      identifier (ZDB-GENO-…), which may differ from the fish identifier and may be
      absent if not yet registered.

      Note the recursion: ``background`` is itself a Genotype. A wild-type strain
      such as AB is simply a Genotype with no alterations (ZFIN models this the same
      way — a fish's "Background ID" is a ZDB-GENO). There is therefore one concept
      here, not two: a background *is* a line.
    slots:
      - genotype_zfin_id
      - genotype_name
      - mutant_allele
      - transgenic_allele
      - background
    exact_mappings:
      - GENO:0000000

  Cross:
    is_a: ZappEntity
    description: >-
      How the experimental animals were produced: the mating that generated the
      clutch, plus how the resulting genotype was established. An incross is
      represented by the same line on both sides.

      This matters because a genotype is not derivable from the parents alone — it
      follows from the cross *plus* selection. A het × het incross segregates 1:2:1,
      so an unsorted clutch has no single genotype, and an unqualified phenotype
      prevalence from such a clutch may be a Mendelian ratio rather than a
      toxicological effect. ``progeny_selection`` is what distinguishes those.
    slots:
      - maternal_line
      - paternal_line
      - progeny_selection

  MutantAllele:
    is_a: ZappEntity
    description: >-
      A mutant allele (genomic feature) carried by the fish, together with its
      zygosity and the gene it affects. The allele identifier is a ZFIN genomic
      feature id (ZDB-ALT-…); ZAPP additionally records the affected gene
      (affected genomic region).
    slots:
      - allele_id
      - allele_symbol
      - alteration_type
      - affected_gene_id
      - affected_gene_symbol
      - zygosity
      - mother_zygosity
      - father_zygosity
    slot_usage:
      allele_symbol:
        required: true

  TransgenicAllele:
    is_a: ZappEntity
    description: >-
      A transgenic insertion (genomic feature) carried by the fish, together with
      its zygosity and the transgenic construct it derives from. The allele
      identifier is a ZFIN genomic feature id (ZDB-ALT-…); the construct is a ZFIN
      transgenic construct (ZDB-TGCONSTRCT-…) used mainly for name display. The
      gene slots record the construct's driver / reporter gene so the atlas can be
      searched by gene across mutant and transgenic alleles alike.
    slots:
      - allele_id
      - allele_symbol
      - construct_id
      - construct_name
      - alteration_type
      - affected_gene_id
      - affected_gene_symbol
      - zygosity
      - mother_zygosity
      - father_zygosity
    slot_usage:
      allele_symbol:
        required: true
      alteration_type:
        description: >-
          Type of alteration for a transgenic feature — usually a transgenic
          insertion (SO:0001218). Normalized to a Sequence Ontology term.
      affected_gene_id:
        description: >-
          Identifier of the gene whose regulatory region drives the transgene
          (e.g. fli1 in Tg(fli1:EGFP)), typically a ZFIN gene id (ZDB-GENE-…).
      affected_gene_symbol:
        description: Symbol of the transgene's driver / reporter gene, e.g. "fli1".

  # NOTE: there is deliberately no `Background` class. A wild-type background (AB,
  # TL, WIK…) is just a Genotype with no alterations — see Genotype.background.

  # Operational entities (research groups and what they keep on hand)
  ResearchGroup:
    is_a: ZappEntity
    description: A named collection of users that have shared editing access.
    slots:
      - name
    slot_usage:
      name:
        required: true

  ResearchGroupMember:
    is_a: ZappEntity
    description: Membership of an ORCID identity in a research group.
    annotations:
      timestamped: true
    slots:
      - research_group
      - member
      - role
    unique_keys:
      membership_grain:
        unique_key_slots:
          - research_group
          - member

  ChemicalCabinetEntry:
    is_a: ZappEntity
    description: >-
      A chemical a research group keeps on hand. Recorded once, then reused to
      pre-fill curation instead of re-searching the chemical each time.
    annotations:
      timestamped: true
    slots:
      - research_group
      - chemical_id
    slot_usage:
      chemical_id:
        required: true
    unique_keys:
      cabinet_grain:
        unique_key_slots:
          - research_group
          - chemical_id

  FishTankEntry:
    is_a: ZappEntity
    description: >-
      A fish line a research group maintains. Recorded once, then reused to
      pre-fill curation instead of re-searching the line each time.
    annotations:
      timestamped: true
    slots:
      - research_group
      - fish
    slot_usage:
      fish:
        required: true
        description: The fish line the group maintains.
    unique_keys:
      tank_grain:
        unique_key_slots:
          - research_group
          - fish

  # Value objects (not entities, inlined)
  QuantityValue:
    description: >-
      A value of an attribute that is quantitative and measurable,
      expressed as a combination of a unit and a numeric value
    slots:
      - unit
      - numeric_value


slots:
  # Identifier slots
  id:
    identifier: true
    description: Auto-generated integer identifier.
    range: integer

  term_uri:
    identifier: true
    description: The URI of the phenotype ontology term.
    range: uriorcurie
    required: true

  # Other slots
  publication:
    description: The publication identifier (e.g., PMID, DOI) for the study or "not published" if the study is unpublished.
    range: string
  synonym:
    description: Human-readable name(s) for the chemical (non-CURIE), used for display and search. The canonical identity is chemical_id.
    range: string
    multivalued: true
  name:
    description: Name or label of an entity.

  # Fish / genotype slots
  fish_zfin_id:
    description: >-
      ZFIN fish identifier (ZDB-FISH-…) for the subject. Distinct from the
      genotype identifier; may be absent for lab-specific fish not yet registered.
    range: uriorcurie
    pattern: "^ZFIN:ZDB-FISH-[0-9]{6}-[0-9]+$"
  genotype:
    description: The intrinsic genotype of the fish.
    range: Genotype
    inlined: true
    inlined_as_list: true
    multivalued: false
  genotype_zfin_id:
    description: >-
      ZFIN genotype identifier (ZDB-GENO-…) for the intrinsic genotype. May be
      absent for genotypes not yet registered with ZFIN.
    range: uriorcurie
    pattern: "^ZFIN:ZDB-GENO-[0-9]{6}-[0-9]+$"
  genotype_name:
    description: >-
      Display name of the genotype, e.g. "fgf8a<ti282a/ti282a>; rerea<tb210/tb210>".
    range: string
  mutant_allele:
    description: Mutant allele(s) carried by the genotype.
    range: MutantAllele
    multivalued: true
    inlined: true
    inlined_as_list: true
  transgenic_allele:
    description: Transgenic insertion(s) carried by the genotype.
    range: TransgenicAllele
    multivalued: true
    inlined: true
    inlined_as_list: true
  background:
    description: >-
      The genetic background this line was bred into — itself a Genotype, normally a
      wild-type strain such as AB (i.e. a Genotype carrying no alterations). ZFIN
      models a fish's background the same way, as a ZDB-GENO reference.
    range: Genotype
    inlined: true
    inlined_as_list: true
    multivalued: false
  cross:
    description: >-
      The mating that produced the experimental animals, and how their genotype was
      established. Defaults conceptually to an incross of the fish's own line.
    range: Cross
    inlined: true
    inlined_as_list: true
    multivalued: false
  maternal_line:
    description: The line (Genotype) of the female parent. Determines maternal contribution.
    range: Genotype
    inlined: true
    inlined_as_list: true
    multivalued: false
  paternal_line:
    description: The line (Genotype) of the male parent.
    range: Genotype
    inlined: true
    inlined_as_list: true
    multivalued: false
  progeny_selection:
    description: >-
      How the genotype of the exposed animals was established from the cross —
      essential for interpreting phenotype prevalence.
    range: ProgenySelectionEnum
  allele_id:
    description: ZFIN genomic feature identifier (ZDB-ALT-…) for the allele.
    range: uriorcurie
    pattern: "^ZFIN:ZDB-ALT-[0-9]{6}-[0-9]+$"
  allele_symbol:
    description: The allele symbol / designation, e.g. "ti282a", "fh111", "w200Tg".
    range: string
  affected_gene_id:
    description: >-
      Identifier of the gene affected by the allele (affected genomic region),
      typically a ZFIN gene id (ZDB-GENE-…).
    range: uriorcurie
  affected_gene_symbol:
    description: Symbol of the gene affected by the allele, e.g. "snapc1b".
    range: string
  construct_id:
    description: >-
      ZFIN transgenic construct identifier (ZDB-TGCONSTRCT-…) for a transgenic
      allele.
    range: uriorcurie
    pattern: "^ZFIN:ZDB-TGCONSTRCT-[0-9]{6}-[0-9]+$"
  construct_name:
    description: Name of the transgenic construct, e.g. "Tg(mpeg1:YFP)".
    range: string
  alteration_type:
    description: >-
      The type of sequence alteration the allele represents, chosen from a
      controlled dropdown of common mutation / alteration types and normalized to a
      Sequence Ontology (SO) term. ZFIN records this as the feature's SO type.
    range: SequenceAlterationTypeEnum
  zygosity:
    description: Zygosity of the allele in the fish.
    range: ZygosityEnum
  mother_zygosity:
    description: Zygosity of the allele in the maternal parent.
    range: ZygosityEnum
  father_zygosity:
    description: Zygosity of the allele in the paternal parent.
    range: ZygosityEnum

  exposure_type:
    description: An instance of exposure specifying the type of stressor a subject was exposed to.
    range: ExposureType
    inlined: true
    inlined_as_list: true
  unit:
    description: The unit of the quantity value.
  numeric_value:
    description: The numeric value of the quantity value.
  experiment:
    description: The experiment in a study.
    range: Experiment
    multivalued: true
    inlined_as_list: true
    inlined: true
  phenotype_observation:
    description: The phenotype observation resulting from an exposure event.
    range: PhenotypeObservationSet
    multivalued: true
    inlined: true
    inlined_as_list: true
  control:
    description: An observation that serves as the reference for assessing phenotypic outcome.
    range: Control
    multivalued: true
    inlined: true
    inlined_as_list: true
  fish:
    description: The fish subject of the experiment.
    range: Fish
    inlined_as_list: true
    inlined: true
  image:
    description: Images associated with this observation.
    range: Image
    multivalued: true
    inlined_as_list: true
    inlined: true
  phenotype:
    description: The phenotype observed.
    range: Phenotype
    inlined_as_list: true
    inlined: true
    multivalued: true
  stage:
    description: The developmental stage of fish when the phenotype was observed.
    range: uriorcurie
  prevalence:
    description: The percentage of subject exhibiting this phenotype.
    range: QuantityValue
    inlined_as_list: true
    inlined: true
  severity:
    description: The intensity of the observed phenotype.
    range: SeverityEnum
  phenotype_term_id:
    description: The phenotype ontology term.
    range: PhenotypeTerm
    inlined: true
    inlined_as_list: true
  term_label:
    description: The human-readable label for the phenotype ontology term.
    range: string
  control_type:
    description: Type of control (e.g., wildtype vs mutant, treated vs untreated).
    range: string
  vehicle_type:
    description: The type of vehicle used to deliver a stressor, drawn from a controlled vocabulary.
    range: VehicleEnum
    required: true
  vehicle_if_treated:
    description: The vehicle used in a control.
    range: VehicleOfTransmission
    inlined: true
    inlined_as_list: true
  control_id:
    description: Identifier for the control, used to link control images to specific controls.
    range: string
  control_image:
    description: Image associated with this control.
    range: ControlImage
    multivalued: true
    inlined: true
    inlined_as_list: true
  phenotype_id:
    description: Foreign key reference to the PhenotypeObservationSet uuid (for database representation).
    range: string
  exposure_event:
    description: The exposure event in an experiment.
    range: ExposureEvent
    multivalued: true
    inlined_as_list: true
    inlined: true
  standard_rearing_condition:
    description: An indication of whether the subject was maintained under standard conditions, which are the established, consistent environmental and husbandry parameters (such as temperature, lighting, diet, and housing) designed to minimize variability and ensure reproducibility in experiments.
    range: boolean
  number_of_individual_exposure:
    description: Total number of individual exposures.
    range: integer
  rearing_condition_comment:
    description: Comments on rearing conditions, for example, about how conditions deviated from standard parameters.
    range: string
  stressor:
    description: Substance, chemical or toxicant that elicits a response (a phenotype) in a subject when encountered through exposure.
    range: StressorChemical
    multivalued: true
    inlined_as_list: true
    inlined: true
  vehicle:
    description: The substance or medium used to deliver a stressor.
    range: VehicleOfTransmission
    multivalued: true
    inlined_as_list: true
    inlined: true
  route:
    description: The route of exposure.
    range: ExposureRoute
    inlined: true
    inlined_as_list: true
  regimen:
    description: The regimen for the exposure.
    range: Regimen
    multivalued: false
    inlined_as_list: true
    inlined: true
  exposure_start_stage:
    description: The developmental stage of fish when exposure started.
    range: uriorcurie
    multivalued: false
  exposure_end_stage:
    description: The developmental stage of fish when exposure ended.
    range: uriorcurie
    multivalued: false
  comment:
    description: Additional comments.
    range: string
  additional_exposure_condition:
    description: Additional information about the conditions under which exposure event occurred.
    range: string
  cas_id:
    description: CAS identifier for the chemical.
    range: string
  unrecognized_chemical_name:
    description: Free-text name for a chemical or vehicle that could not be resolved to a standardized identifier.
    range: string
  unrecognized_manufacturer_name:
    description: Free-text name for a manufacturer or supplier that is not in the controlled ManufacturerEnum list.
    range: string
  chemical_id:
    description: Chemical identifier (e.g., a CHEBI or other ontology URI) for the chemical.
    range: uriorcurie
  manufacturer:
    description: The manufacturer or supplier of the chemical.
    range: ManufacturerEnum
  concentration:
    description: The dose or concentration of the chemical to which the subject was exposed to.
    range: QuantityValue
    inlined_as_list: true
    inlined: true
  interval_between_individual_exposures:
    description: Interval between individual exposures.
    range: QuantityValue
    inlined_as_list: true
    inlined: true
  total_exposure_duration:
    description: Time between first and last individual exposure.
    range: QuantityValue
    inlined_as_list: true
    inlined: true
  individual_exposure_duration:
    description: Individual exposure duration.
    range: QuantityValue
    inlined_as_list: true
    inlined: true
  exposure_regimen_type:
    description: The type of exposure regimen (e.g., continuous or repeated).
    range: ExposureRegimenTypeEnum
  magnification:
    description: The factor by which a microscope enlarges the apparent size of a subject compared to its actual size.
    range: string
  resolution:
    description: The level of detail in the image.
    range: string
  scale_bar:
    description: Scale bar information, including the physical length it represents and the unit of measurement.
    range: string
  annotator:
    description: ORCID identifier of the indidvidual submitting the study data.
    range: uriorcurie
    multivalued: true
    pattern: "^ORCID:[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$"
  lab:
    description: ZFIN lab identifier of the laboratory that produced the study data.
    range: uriorcurie
    pattern: "^ZFIN:ZDB-LAB-[0-9]+-[0-9]+$"
  phenotype_comments:
    description: Comments about the phenotype in the control image.
    range: string
  research_group:
    description: The research group an entry belongs to.
    range: ResearchGroup
    required: true
  member:
    description: ORCID identifier of a research group member.
    range: uriorcurie
    required: true
    pattern: "^ORCID:[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$"
  role:
    description: A member's permission level within a research group.
    range: ResearchGroupRoleEnum
    required: true

enums:

  ResearchGroupRoleEnum:
    description: An enumeration of permission levels within a research group.
    permissible_values:
      admin:
        description: Can manage group membership as well as the group's data.
      member:
        description: Can edit the group's data.

  ProgenySelectionEnum:
    description: >-
      How the genotype of the exposed animals was established from the cross. A het
      × het incross segregates 1:2:1, so an unsorted clutch is a mixture — without
      this, a reported phenotype prevalence cannot be distinguished from a Mendelian
      ratio.
    permissible_values:
      genotyped:
        description: Each animal was individually genotyped, so the genotype is certain.
      phenotype_sorted:
        description: Animals were sorted by visible phenotype rather than genotyped.
      assumed_uniform:
        description: >-
          Parents were homozygous (or the line is stable), so all progeny are assumed
          to share the genotype.
      segregating:
        description: >-
          A segregating clutch used without selection — the stated genotype applies to
          only a fraction of the animals.
      unknown:
        description: Not stated in the source.

  ZygosityEnum:
    description: >-
      Zygosity of an allele in a fish or in one of its parents. Applies both to
      the fish's own allele zygosity and to parental (maternal / paternal)
      zygosity, which matters for maternal-effect phenotypes.
    permissible_values:
      homozygous:
        description: Homozygous — the allele is present on both homologous chromosomes.
        meaning: GENO:0000136
      heterozygous:
        description: Heterozygous — the allele is present on one of the two homologous chromosomes.
        meaning: GENO:0000135
      unknown:
        description: Zygosity is unknown or unspecified.
        meaning: GENO:0000137
      wild_type:
        description: >-
          Wild type at this locus — carries zero copies of the allele (ZFIN's
          parental "W"). Chiefly meaningful for mother/father zygosity: a fish
          that is itself wild type for an allele would normally just not list it.

  SequenceAlterationTypeEnum:
    description: >-
      Common types of sequence alteration for an allele or transgenic feature.
      Each value is normalized to a Sequence Ontology (SO) term so curators pick a
      familiar label while the atlas stores the standard identifier.
    permissible_values:
      point_mutation:
        description: A single-nucleotide substitution.
        meaning: SO:1000008
      substitution:
        description: One or more nucleotides replaced by the same number of nucleotides.
        meaning: SO:1000002
      deletion:
        description: Loss of one or more nucleotides.
        meaning: SO:0000159
      insertion:
        description: Gain of one or more nucleotides.
        meaning: SO:0000667
      indel:
        description: >-
          A combined insertion and deletion affecting 2 or more bases. NOTE: SO's
          canonical label for SO:1000032 is "delins"; "indel" is a registered SO
          synonym and is the term curators actually use at the bench (e.g. CRISPR
          indels), so it is deliberately the label shown here. Do not "correct" it.
        meaning: SO:1000032
      inversion:
        description: A segment reversed in orientation.
        meaning: SO:1000036
      duplication:
        description: One or more copies of a segment added.
        meaning: SO:1000035
      transgenic_insertion:
        description: An engineered transgenic construct inserted into the genome.
        meaning: SO:0001218
      complex_substitution:
        description: A substitution involving a different number of nucleotides.
        meaning: SO:1000005
      deficiency:
        description: >-
          A large chromosomal deletion removing a whole segment (ZFIN's
          "Deficiency" Df(...) lines, 111 alleles). SO's canonical label for
          SO:1000029 is "chromosomal_deletion"; "deficiency" is the term
          zebrafish curators actually use, so it is the label shown here.
        meaning: SO:1000029
      translocation:
        description: A segment moved to a different chromosomal location.
        meaning: SO:0000199
      multiple_variants:
        description: >-
          An allele carrying several distinct variants under one name (377 ZFIN
          alleles). Mirrors ZFIN's typing of these records with SO:0001023 —
          that SO term names the "allele" concept rather than an alteration
          class, but it is exactly what ZFIN stamps on such features, so
          mapping it keeps them filterable rather than label-only.
        meaning: SO:0001023
      sequence_alteration:
        description: Alteration of unspecified or other type (SO root term).
        meaning: SO:0001059

  SeverityEnum:
    description: An enumeration of severity levels for phenotypes.
    permissible_values:
      mild:
        description: Mild severity
      moderate:
        description: Moderate severity
      severe:
        description: Severe severity

  ExposureRegimenTypeEnum:
    description: An enumeration of exposure regimen types.
    permissible_values:
      continuous:
        description: Continuous exposure
        meaning: EXO:0000109
      repeated:
        description: Repeated exposure
        meaning: EXO:0000110

  # VehicleEnum and ManufacturerEnum are defined in chemical_enums.yaml
  # (imported above) to keep this schema focused on structure.
