---
id: https://w3id.org/sierra-moxon/zebrafish-toxicology-atlas-schema
name: zebrafish-toxicology-atlas-schema
title: zebrafish-toxicology-atlas-schema
description: |-
  Schema to represent metadatcha associated with the Zebrafish Toxicology Atlas
license: MIT
see_also:
  - https://sierra-moxon.github.io/zebrafish-toxicology-atlas-schema

prefixes:
  zebrafish_toxicology_atlas_schema: https://w3id.org/sierra-moxon/zebrafish-toxicology-atlas-schema/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: https://example.org/
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  CAS: https://commonchemistry.cas.org/detail?cas_rn=
  ECTO: http://purl.obolibrary.org/obo/ECTO_
  # EXO's own spelling. It also has a few ids under EXO_, which name other terms.
  ExO: http://purl.obolibrary.org/obo/ExO_
  ZP: http://purl.obolibrary.org/obo/ZP_
  ORCID: https://orcid.org/
  ZFIN: https://zfin.org/
  SO: http://purl.obolibrary.org/obo/SO_
  GENO: http://purl.obolibrary.org/obo/GENO_
  UMLS: https://uts.nlm.nih.gov/uts/umls/concept/
  "PUBCHEM.COMPOUND": https://identifiers.org/pubchem.compound/
  UNII: https://fdasis.nlm.nih.gov/srs/unii/
default_prefix: zebrafish_toxicology_atlas_schema
default_range: string

imports:
  - linkml:types
  - chemical_enums

classes:

  # Base classes for different ID strategies
  ZappEntity:
    description: Internal entities with auto-generated integer IDs.
    abstract: true
    slots:
      - id

  OntologyEntity:
    description: Entities representing ontology terms with URI identifiers.
    abstract: true

  # Internal entities (integer autoincrement)
  Study:
    is_a: ZappEntity
    description: A toxicological investigation, including the experimental conditions and phenotypic outcomes, with information provenance.
    annotations:
      timestamped: true
    slots:
      - research_group
      - status
      - experiment
      - publication
      - nickname
      - description
      - annotator
      - lab
    slot_usage:
      research_group:
        description: >-
          The research group the study belongs to, whose members may edit it.
      nickname:
        description: >-
          A short working name for the study, and what it is listed under when
          picking a study. Required while the study has no publication
          identifier; no two studies in a research group may share one.
      description:
        description: A free-text summary of what the study set out to do.
    rules:
      - description: >-
          A study that has no publication identifier yet must still be
          recognisable to the people working on it, so an unpublished study
          carries a nickname instead.
        preconditions:
          slot_conditions:
            publication:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            nickname:
              required: true
    unique_keys:
      study_nickname_grain:
        unique_key_slots:
          - research_group
          - nickname

  Experiment:
    is_a: ZappEntity
    description: A group of observations (phenotypic outcomes and their control) that are linked by a common exposure event and subject, and that are part of a study.
    slots:
      - standard_rearing_condition
      - rearing_condition_comment
      - fish
      - control
      - exposure_event

  PhenotypeObservationSet:
    is_a: ZappEntity
    description: An observation set containing control and phenotypic outcome resulting from an exposure event.
    slots:
      - image
      - phenotype
      - control_image

  Phenotype:
    is_a: ZappEntity
    description: Any measurable or visible trait change in the subject as a result of exposure.
    slots:
      - stage
      - prevalence
      - severity
      - phenotype_term_id

  Control:
    is_a: ZappEntity
    description: A subject serves as a reference for assessing phenotypic outcome in the phenotype observation set. 
    slots:
      - control_type
      - vehicle_if_treated
      - comment
      - control_image

  ExposureEvent:
    is_a: ZappEntity
    description: >-
      An occurrence in a study where a subject is exposed to a stressor under defined conditions.
    slots:
      - stressor
      - vehicle
      - route
      - regimen
      - exposure_start_stage
      - exposure_end_stage
      - comment
      - exposure_type
      - additional_exposure_condition
      - phenotype_observation
    exact_mappings:
      - biolink:ExposureEvent

  Regimen:
    is_a: ZappEntity
    description: The schedule and pattern of an exposure event.
    slots:
      - exposure_regimen_type
      - interval_between_individual_exposures
      - total_exposure_duration
      - individual_exposure_duration
      - number_of_individual_exposure

  StressorChemical:
    is_a: ZappEntity
    description: A chemical that elicits a response (a phenotype) in a subject when encountered through exposure.
    slots:
      - chemical_id
      - cas_id
      - unrecognized_chemical_name
      - synonym
      - manufacturer
      - unrecognized_manufacturer_name
      - concentration
      - comment
    rules:
      - description: >-
          A chemical entry must be identifiable: at least one of chemical_id
          (a standardized identifier / CURIE) or unrecognized_chemical_name
          (the free-text fallback for a chemical that could not be resolved)
          must be present.
        # WORKAROUND: an empty preconditions block keeps `gen-doc` from
        # crashing on this unconditional rule (its class template iterates
        # rule.preconditions, which is None when the key is left out). This
        # breaks the zappfish.github.io schema docs build. Remove once the
        # LinkML docgen template handles rules with no preconditions.
        preconditions: {}
        postconditions:
          any_of:
            - slot_conditions:
                chemical_id:
                  required: true
            - slot_conditions:
                unrecognized_chemical_name:
                  required: true
      - description: >-
          Picking the other_not_listed manufacturer escape hatch means the
          supplier has to be named in free text; without it the entry records
          no recoverable supplier at all.
        preconditions:
          slot_conditions:
            manufacturer:
              equals_string: other_not_listed
        postconditions:
          slot_conditions:
            unrecognized_manufacturer_name:
              required: true

  VehicleOfTransmission:
    is_a: ZappEntity
    description: The substance or medium used to deliver a stressor to a subject during an exposure event.
    slots:
      - vehicle_type
      - chemical_id
      - cas_id
      - unrecognized_chemical_name
      - synonym
      - manufacturer
      - unrecognized_manufacturer_name
      - concentration
      - comment
    rules:
      - description: >-
          Picking the other_not_listed vehicle escape hatch means the vehicle
          has to be named in free text; without it the entry records no
          recoverable vehicle at all.
        preconditions:
          slot_conditions:
            vehicle_type:
              equals_string: other_not_listed
        postconditions:
          slot_conditions:
            unrecognized_chemical_name:
              required: true
      - description: >-
          Picking the other_not_listed manufacturer escape hatch means the
          supplier has to be named in free text; without it the entry records
          no recoverable supplier at all.
        preconditions:
          slot_conditions:
            manufacturer:
              equals_string: other_not_listed
        postconditions:
          slot_conditions:
            unrecognized_manufacturer_name:
              required: true

  Image:
    is_a: ZappEntity
    description: An image associated with a phenotype observation.
    slots:
      - magnification
      - resolution
      - scale_bar
      - image_scope

  ControlImage:
    is_a: ZappEntity
    description: An image associated with a control, taken at the same developmental stage as the corresponding phenotype observation.
    slots:
      - phenotype_id
      - magnification
      - resolution
      - scale_bar
      - phenotype_comments

  # Ontology entities (string URI identifiers)
  PhenotypeTerm:
    is_a: OntologyEntity
    description: A phenotype ontology term from the Zebrafish Phenotype ontology (ZP).
    slots:
      - term_uri
      - term_label
    exact_mappings:
      - biolink:PhenotypicFeature

  ExposureType:
    is_a: OntologyEntity
    description: |
      An exposure-type term from ECTO.
    slots:
      - term_uri
      - term_label
    slot_usage:
      term_label:
        required: true

  # The fish, as the curator describes it
  Fish:
    is_a: ZappEntity
    description: >-
      A zebrafish line as the curator describes it: alleles on a wild-type
      background, plus any transient reagents injected into the embryos. The
      server sets fish_zfin_id and genotype_zfin_id when the fish is saved,
      by matching the description against ZFIN's registered records; they
      are absent when ZFIN has no such record.
    slots:
      - fish_zfin_id
      - genotype_zfin_id
      - background_zfin_id
      - background_name
      - allele
      - transient_reagent
      - line_description

  Allele:
    is_a: ZappEntity
    description: >-
      An allele the fish carries, mutant or transgenic: the gene it alters or
      the construct it holds, and its zygosity in the fish and, when known,
      the parents. ``alteration_type`` says which kind it is.
    slots:
      - allele_zfin_id
      - allele_symbol
      - alteration_type
      - affected_gene_zfin_id
      - affected_gene_symbol
      - construct_zfin_id
      - construct_name
      - zygosity
      - mother_zygosity
      - father_zygosity
    slot_usage:
      allele_symbol:
        required: true
      zygosity:
        required: true

  TransientReagent:
    is_a: ZappEntity
    description: >-
      A sequence-targeting reagent injected into the embryos (a morpholino,
      CRISPR or TALEN). Transient and not heritable, so part of the fish and
      not of its genotype. Dose and injection stage belong to the experiment.
    slots:
      - reagent_zfin_id
      - reagent_symbol
      - reagent_type
      - affected_gene_zfin_id
      - affected_gene_symbol
    slot_usage:
      reagent_symbol:
        required: true

  # Operational entities (research groups and what they keep on hand)
  ResearchGroup:
    is_a: ZappEntity
    description: A named collection of users that have shared editing access.
    slots:
      - name
    slot_usage:
      name:
        required: true

  ResearchGroupMember:
    is_a: ZappEntity
    description: Membership of an ORCID identity in a research group.
    annotations:
      timestamped: true
    slots:
      - research_group
      - member
      - role
    unique_keys:
      membership_grain:
        unique_key_slots:
          - research_group
          - member

  ChemicalCabinetEntry:
    is_a: ZappEntity
    description: >-
      A chemical a research group keeps on hand. Recorded once, then reused to
      pre-fill curation instead of re-searching the chemical each time. An
      entry is one stock on the shelf: the same chemical from two suppliers is
      two entries, so both can be picked while a group transitions between
      suppliers.
    annotations:
      timestamped: true
    slots:
      - research_group
      - chemical_id
      - nickname
      - manufacturer
      - unrecognized_manufacturer_name
      - vehicle_type
    slot_usage:
      chemical_id:
        required: true
      nickname:
        description: >-
          What the group calls this chemical, e.g. "BPA stock". Optional; when
          given it is what the chemical is listed under when pre-filling a
          submission, and no two entries in the group may share it.
      manufacturer:
        description: >-
          The supplier this stock comes from. Optional, and part of the cabinet
          grain: entries for the same chemical are told apart by it.
      vehicle_type:
        required: false
        description: >-
          The vehicle the group habitually delivers this chemical in, offered
          as a pre-fill default and corrected per submission like any other.
          other_not_listed is not accepted here, because the entry has no slot
          to name an unlisted vehicle with.
    rules:
      - description: >-
          Picking the other_not_listed manufacturer escape hatch means the
          supplier has to be named in free text; without it the entry records
          no recoverable supplier at all.
        preconditions:
          slot_conditions:
            manufacturer:
              equals_string: other_not_listed
        postconditions:
          slot_conditions:
            unrecognized_manufacturer_name:
              required: true
    unique_keys:
      cabinet_supplier_grain:
        description: >-
          Replaces cabinet_grain, which did not include manufacturer. The index
          is matched by name on deployed databases, so the widened key needs a
          new one, and db/migrate.py drops the old index.
        unique_key_slots:
          - research_group
          - chemical_id
          - manufacturer
      cabinet_nickname_grain:
        unique_key_slots:
          - research_group
          - nickname

  FishTankEntry:
    is_a: ZappEntity
    description: >-
      A fish line a research group maintains. Recorded once, then reused to
      pre-fill curation instead of re-searching the line each time.
    annotations:
      timestamped: true
    slots:
      - research_group
      - fish
      - nickname
    slot_usage:
      fish:
        required: true
        description: The fish line the group maintains.
      nickname:
        description: >-
          What the group calls this line, e.g. "our fli1 reporter". Optional;
          when given it is what the line is listed under when pre-filling a
          submission, and no two entries in the group may share it.
    unique_keys:
      tank_nickname_grain:
        unique_key_slots:
          - research_group
          - nickname

  # Value objects (not entities, inlined)
  QuantityValue:
    description: >-
      A value of an attribute that is quantitative and measurable,
      expressed as a combination of a unit and a numeric value
    slots:
      - unit
      - numeric_value
    slot_usage:
      numeric_value:
        required: true


slots:
  # Identifier slots
  id:
    identifier: true
    description: Auto-generated integer identifier.
    range: integer

  term_uri:
    identifier: true
    description: The URI of the phenotype ontology term.
    range: uriorcurie
    required: true

  # Other slots
  image_scope:
    description: >-
      Whether the image shows the entire organism or only a region, organ, or
      structure. Phenotype annotations on a partial-organism image should be
      limited to what is visible in the imaged region.
    range: ImageScopeEnum
  publication:
    description: >-
      The persistent publication identifier (e.g., PMID, DOI) for the study.
      Absent while the study is unpublished, in which case its nickname
      identifies it instead. A PubMed id as PMID:22194820, or a DOI as
      DOI:10.1000/xyz123.
    range: string
    # Blank is allowed because blank text is stored as no value at all, and
    # a blank form field is how a client says a study has no publication.
    pattern: "^(\\s*|PMID:[0-9]+|DOI:10\\.[0-9]{4,9}/\\S+)$"
    examples:
      - value: PMID:22194820
  nickname:
    description: >-
      An informal label a research group gives to something it works with,
      shown in place of its formal name when picking it. Unlike a synonym it
      is not a formally recognised name, and it is unique only within the
      group that chose it. At most 200 characters.
    range: string
    # LinkML has no length limit of its own; the pattern is how one is said.
    pattern: "^.{0,200}$"
  description:
    description: A free-text description of an entity.
    range: string
  synonym:
    description: Human-readable name(s) for the chemical (non-CURIE), used for display and search. The canonical identity is chemical_id.
    range: string
    multivalued: true
  name:
    description: Name or label of an entity.
  exposure_type:
    description: An instance of exposure specifying the type of stressor a subject was exposed to.
    range: ExposureType
    inlined: true
    inlined_as_list: true
  unit:
    description: The unit of the quantity value.
  numeric_value:
    description: The numeric value of the quantity value.
    range: float
    minimum_value: 0
  experiment:
    description: The experiment in a study.
    range: Experiment
    multivalued: true
    inlined_as_list: true
    inlined: true
  phenotype_observation:
    description: The phenotype observation resulting from an exposure event.
    range: PhenotypeObservationSet
    multivalued: true
    inlined: true
    inlined_as_list: true
  control:
    description: An observation that serves as the reference for assessing phenotypic outcome.
    range: Control
    multivalued: true
    inlined: true
    inlined_as_list: true
  fish:
    description: The fish subject of the experiment.
    range: Fish
    inlined_as_list: true
    inlined: true

  # How a fish is described (see Fish). Every ZFIN id is a CURIE with the
  # prefix ZFIN and ZFIN's own ZDB id, whose middle part says what kind of
  # record it names.
  fish_zfin_id:
    description: >-
      ZFIN's id for the registered fish this description matches (ZDB-FISH-…),
      when it matches one.
    range: uriorcurie
    readonly: Set by the server from ZFIN's registry when the fish is saved.
    pattern: "^ZFIN:ZDB-FISH-\\d{6}-\\d+$"
    examples:
      - value: ZFIN:ZDB-FISH-150901-27842
  genotype_zfin_id:
    description: >-
      ZFIN's id for the registered genotype this description matches
      (ZDB-GENO-…), when it matches one.
    range: uriorcurie
    readonly: Set by the server from ZFIN's registry when the fish is saved.
    pattern: "^ZFIN:ZDB-GENO-\\d{6}-\\d+$"
    examples:
      - value: ZFIN:ZDB-GENO-960809-7
  background_zfin_id:
    description: >-
      The wild-type line the fish is kept on, as ZFIN's genotype id for that
      line (ZDB-GENO-…). Picked from ZFIN's wild-type lines.
    range: uriorcurie
    pattern: "^ZFIN:ZDB-GENO-\\d{6}-\\d+$"
    examples:
      - value: ZFIN:ZDB-GENO-960809-7
  background_name:
    description: The wild-type line's name as ZFIN abbreviates it, e.g. AB, TU, TL.
    range: string
    examples:
      - value: AB
  allele:
    description: >-
      The alleles the fish carries, mutant and transgenic alike, in the order
      the curator gave them.
    range: Allele
    multivalued: true
    inlined: true
    inlined_as_list: true
  transient_reagent:
    description: The reagents injected into the embryos.
    range: TransientReagent
    multivalued: true
    inlined: true
    inlined_as_list: true
  line_description:
    description: >-
      Free text for what the structured description cannot say: a line ZFIN
      has not registered, or how the fish differs from the record it matched.
    range: string
  allele_zfin_id:
    description: ZFIN's id for the allele (ZDB-ALT-…).
    range: uriorcurie
    pattern: "^ZFIN:ZDB-ALT-\\d{6}-\\d+$"
    examples:
      - value: ZFIN:ZDB-ALT-980203-1091
  allele_symbol:
    description: The allele's designation as ZFIN writes it, e.g. ti282a, fh111, w200Tg.
    range: string
    examples:
      - value: ti282a
  alteration_type:
    description: The kind of sequence alteration the allele is.
    range: SequenceAlterationTypeEnum
  affected_gene_zfin_id:
    description: >-
      ZFIN's id for the gene the allele affects (ZDB-GENE-…); for a transgenic
      insertion, the construct's driver or reporter gene when ZFIN records one.
    range: uriorcurie
    pattern: "^ZFIN:ZDB-GENE-\\d{6}-\\d+$"
    examples:
      - value: ZFIN:ZDB-GENE-990415-72
  affected_gene_symbol:
    description: The symbol of the gene the allele affects, e.g. fgf8a.
    range: string
    examples:
      - value: fgf8a
  construct_zfin_id:
    description: >-
      ZFIN's id for the construct a transgenic insertion holds
      (ZDB-TGCONSTRCT-…). Absent for a mutant allele.
    range: uriorcurie
    pattern: "^ZFIN:ZDB-TGCONSTRCT-\\d{6}-\\d+$"
    examples:
      - value: ZFIN:ZDB-TGCONSTRCT-130130-3
  construct_name:
    description: The construct's name as ZFIN writes it, e.g. Tg(mpeg1:YFP).
    range: string
    examples:
      - value: Tg(mpeg1:YFP)
  zygosity:
    description: The allele's zygosity in the fish. ZFIN records unknown zygosity as a value, and so does this.
    range: ZygosityEnum
  mother_zygosity:
    description: The allele's zygosity in the mother. Absent when not recorded.
    range: ParentZygosityEnum
  father_zygosity:
    description: The allele's zygosity in the father. Absent when not recorded.
    range: ParentZygosityEnum
  reagent_zfin_id:
    description: ZFIN's id for the reagent (ZDB-MRPHLNO-, ZDB-CRISPR- or ZDB-TALEN-…).
    range: uriorcurie
    pattern: "^ZFIN:ZDB-(MRPHLNO|CRISPR|TALEN)-\\d{6}-\\d+$"
    examples:
      - value: ZFIN:ZDB-MRPHLNO-040101-1
  reagent_symbol:
    description: The reagent's name as ZFIN writes it, e.g. MO1-fgf8a.
    range: string
    examples:
      - value: MO1-fgf8a
  reagent_type:
    description: What kind of reagent it is.
    range: ReagentTypeEnum
  image:
    description: Images associated with this observation.
    range: Image
    multivalued: true
    inlined_as_list: true
    inlined: true
  phenotype:
    description: The phenotype observed.
    range: Phenotype
    inlined_as_list: true
    inlined: true
    multivalued: true
  stage:
    description: The developmental stage of fish when the phenotype was observed.
    range: uriorcurie
  prevalence:
    description: The percentage of subjects exhibiting this phenotype, from 0 to 100.
    range: float
    minimum_value: 0
    maximum_value: 100
  severity:
    description: The intensity of the observed phenotype.
    range: SeverityEnum
  phenotype_term_id:
    description: The phenotype ontology term.
    range: PhenotypeTerm
    inlined: true
    inlined_as_list: true
  term_label:
    description: The human-readable label for the phenotype ontology term.
    range: string
  control_type:
    description: Type of control (e.g., wildtype vs mutant, treated vs untreated).
    range: string
  vehicle_type:
    description: The type of vehicle used to deliver a stressor, drawn from a controlled vocabulary.
    range: VehicleEnum
    required: true
  vehicle_if_treated:
    description: The vehicle used in a control.
    range: VehicleOfTransmission
    inlined: true
    inlined_as_list: true
  control_id:
    description: Identifier for the control, used to link control images to specific controls.
    range: string
  control_image:
    description: Image associated with this control.
    range: ControlImage
    multivalued: true
    inlined: true
    inlined_as_list: true
  phenotype_id:
    description: Foreign key reference to the PhenotypeObservationSet uuid (for database representation).
    range: string
  exposure_event:
    description: The exposure event in an experiment.
    range: ExposureEvent
    multivalued: true
    inlined_as_list: true
    inlined: true
  standard_rearing_condition:
    description: An indication of whether the subject was maintained under standard conditions, which are the established, consistent environmental and husbandry parameters (such as temperature, lighting, diet, and housing) designed to minimize variability and ensure reproducibility in experiments.
    range: boolean
  number_of_individual_exposure:
    description: Total number of individual exposures.
    range: integer
    minimum_value: 1
  rearing_condition_comment:
    description: Comments on rearing conditions, for example, about how conditions deviated from standard parameters.
    range: string
  stressor:
    description: Substance, chemical or toxicant that elicits a response (a phenotype) in a subject when encountered through exposure.
    range: StressorChemical
    multivalued: true
    inlined_as_list: true
    inlined: true
  vehicle:
    description: The substance or medium used to deliver a stressor.
    range: VehicleOfTransmission
    multivalued: true
    inlined_as_list: true
    inlined: true
  route:
    description: The route of exposure.
    range: ExposureRouteEnum
  regimen:
    description: The regimen for the exposure.
    range: Regimen
    multivalued: false
    inlined_as_list: true
    inlined: true
  exposure_start_stage:
    description: The developmental stage of fish when exposure started.
    range: uriorcurie
    multivalued: false
  exposure_end_stage:
    description: The developmental stage of fish when exposure ended.
    range: uriorcurie
    multivalued: false
  comment:
    description: Additional comments.
    range: string
  additional_exposure_condition:
    description: Additional information about the conditions under which exposure event occurred.
    range: string
  cas_id:
    description: CAS identifier for the chemical.
    range: string
  unrecognized_chemical_name:
    description: Free-text name for a chemical or vehicle that could not be resolved to a standardized identifier.
    range: string
  unrecognized_manufacturer_name:
    description: Free-text name for a manufacturer or supplier that is not in the controlled ManufacturerEnum list.
    range: string
  chemical_id:
    description: Chemical identifier (e.g., a CHEBI or other ontology URI) for the chemical.
    range: uriorcurie
  manufacturer:
    description: The manufacturer or supplier of the chemical.
    range: ManufacturerEnum
  concentration:
    description: The dose or concentration of the chemical to which the subject was exposed to.
    range: QuantityValue
    inlined_as_list: true
    inlined: true
  interval_between_individual_exposures:
    description: Interval between individual exposures.
    range: QuantityValue
    inlined_as_list: true
    inlined: true
  total_exposure_duration:
    description: Time between first and last individual exposure.
    range: QuantityValue
    inlined_as_list: true
    inlined: true
  individual_exposure_duration:
    description: Individual exposure duration.
    range: QuantityValue
    inlined_as_list: true
    inlined: true
  exposure_regimen_type:
    description: The type of exposure regimen (e.g., continuous or repeated).
    range: ExposureRegimenTypeEnum
  magnification:
    description: The factor by which a microscope enlarges the apparent size of a subject compared to its actual size.
    range: string
  resolution:
    description: The level of detail in the image.
    range: string
  scale_bar:
    description: Scale bar information, including the physical length it represents and the unit of measurement.
    range: string
  annotator:
    description: >-
      ORCID identifiers of the people who entered the study's data: everyone
      who has saved the study or anything in it.
    range: uriorcurie
    multivalued: true
    readonly: Set by the server from whoever is signed in when a save is made.
    pattern: "^ORCID:[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$"
    examples:
      - value: ORCID:0000-0002-1825-0097
  lab:
    description: ZFIN lab identifier of the laboratory that produced the study data.
    range: uriorcurie
    pattern: "^ZFIN:ZDB-LAB-[0-9]+-[0-9]+$"
    examples:
      - value: ZFIN:ZDB-LAB-970408-1
  phenotype_comments:
    description: Comments about the phenotype in the control image.
    range: string
  research_group:
    description: The research group an entry belongs to.
    range: ResearchGroup
    required: true
  member:
    description: ORCID identifier of a research group member.
    range: uriorcurie
    required: true
    pattern: "^ORCID:[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$"
    examples:
      - value: ORCID:0000-0002-1825-0097
  status:
    description: >-
      Whether a study is still being worked on or is ready to be seen. A draft
      is visible only to the members of its research group.
    range: StudyStatusEnum
    required: true
  role:
    description: A member's permission level within a research group.
    range: ResearchGroupRoleEnum
    required: true

enums:

  ImageScopeEnum:
    description: An enumeration of how much of the organism an image shows.
    permissible_values:
      whole_organism:
        description: The entire fish, head to tail.
      partial_organism:
        description: A specific region, organ, or structure (e.g., head, heart, fin, eye).

  StudyStatusEnum:
    description: An enumeration of how far along a study is.
    permissible_values:
      draft:
        description: Still being entered; visible only to its research group.
      published:
        description: Ready to be seen; visible to everyone.

  ResearchGroupRoleEnum:
    description: An enumeration of permission levels within a research group.
    permissible_values:
      admin:
        description: Can manage group membership as well as the group's data.
      member:
        description: Can edit the group's data.

  SeverityEnum:
    description: An enumeration of severity levels for phenotypes.
    permissible_values:
      mild:
        description: Mild severity
      moderate:
        description: Moderate severity
      severe:
        description: Severe severity

  ExposureRouteEnum:
    description: >-
      The ways a fish comes into contact with a stressor, each one of EXO's
      exposure routes (ExO:0000055).
    permissible_values:
      aquatic_environment:
        description: Through the water the fish is kept in.
        meaning: ExO:0000161
      ingestion:
        description: Through the diet.
        meaning: ExO:0000056
      gavage:
        description: Administered directly into the gastrointestinal tract.
        meaning: ExO:0000166
      injection:
        meaning: ExO:0000060

  ExposureRegimenTypeEnum:
    description: >-
      An enumeration of exposure regimen types. Where EXO has a term for one
      among its exposure regimens (ExO:0000172), that is its meaning.
    permissible_values:
      single:
        description: One exposure, given once. EXO has no term for it.
      continuous:
        description: Continuous exposure, uninterrupted over a period of time.
        meaning: ExO:0000167
      repeated:
        description: Repeated exposure, more than once at intervals.
        meaning: ExO:0000171

  # VehicleEnum and ManufacturerEnum are defined in chemical_enums.yaml
  # (imported above) to keep this schema focused on structure.

  SequenceAlterationTypeEnum:
    description: >-
      The kinds of sequence alteration ZFIN records for its alleles, each with
      its Sequence Ontology term. The SO id is how a ZFIN record maps onto
      these values.
    permissible_values:
      point_mutation:
        meaning: SO:1000008
      substitution:
        meaning: SO:1000002
      deletion:
        meaning: SO:0000159
      insertion:
        meaning: SO:0000667
      indel:
        meaning: SO:1000032
      mnv:
        description: A multiple-nucleotide variant.
        meaning: SO:0002007
      inversion:
        meaning: SO:1000036
      duplication:
        meaning: SO:1000035
      transgenic_insertion:
        meaning: SO:0001218
      complex_substitution:
        meaning: SO:1000005
      deficiency:
        description: A chromosomal deletion.
        meaning: SO:1000029
      translocation:
        meaning: SO:0000199
      multiple_variants:
        description: An allele with several variants.
        meaning: SO:0001023
      unknown:
        description: An alteration ZFIN has not characterised.
        meaning: SO:0001059

  ZygosityEnum:
    description: >-
      An allele's zygosity, in ZFIN's terms. ZFIN registers genotypes with
      unknown zygosity, so unknown is a value here too, and a description
      saying unknown matches only those genotypes.
    permissible_values:
      unknown:
        meaning: GENO:0000137
      heterozygous:
        meaning: GENO:0000135
      homozygous:
        meaning: GENO:0000136
      complex:
        description: Several alleles of one gene in a combination ZFIN calls complex.

  ParentZygosityEnum:
    description: >-
      An allele's zygosity in one of the fish's parents. As ZygosityEnum, plus
      wild type: a parent, unlike the fish being described, may not carry the
      allele at all.
    permissible_values:
      unknown:
        meaning: GENO:0000137
      heterozygous:
        meaning: GENO:0000135
      homozygous:
        meaning: GENO:0000136
      complex:
        description: Several alleles of one gene in a combination ZFIN calls complex.
      wild_type:
        description: The parent does not carry the allele.

  ReagentTypeEnum:
    description: The kinds of transient, sequence-targeting reagent ZFIN registers.
    permissible_values:
      morpholino:
        meaning: SO:0000034
      crispr:
        description: A CRISPR guide. ZFIN's SO term for these describes the binding site rather than the reagent, so none is given.
      talen:
        description: A TALEN. As for CRISPR, no SO term is given.
