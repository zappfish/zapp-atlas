name: Test

on:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: server
      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen
      # The /edit tests hit routes that render the built React client, so the
      # client must be built before pytest runs (mirrors the Docker image).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build
      # The client's API types are generated from the OpenAPI document. A test
      # below checks the committed document is current; this checks the types
      # generated from it are.
      - name: Check generated API types
        working-directory: client
        run: npm run api-types -- --check
      # Browser tests: Playwright starts the real server on a throwaway
      # database and drives the built client. See client/playwright.config.ts.
      - name: Install the browser for end-to-end tests
        working-directory: client
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run end-to-end tests
        working-directory: client
        run: npm run e2e
      - name: Run tests
        working-directory: server
        run: uv run --no-sync pytest
