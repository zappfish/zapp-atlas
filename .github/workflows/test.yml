name: Test

on:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: server
      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen
      - name: Run tests
        working-directory: server
        run: uv run --no-sync pytest
